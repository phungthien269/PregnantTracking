# CI — Mẹ & Bé (Agent 7, task E.7)
# pnpm install (có cache) → typecheck → build. Chạy trên push/PR nhánh main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test domain (8)
        run: bash scripts/test-domain.sh

      - name: Test web (39)
        run: bash scripts/test-web.sh

      - name: Build
        run: pnpm build
